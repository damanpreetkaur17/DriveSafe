# Driver Drowsiness Detection — Master Configuration
# All adjustable settings live here. Do not hardcode thresholds in source.

seed: 42

dataset:
  root: "D:/Projects/AI ML/drowsiness-ml/dataset/Drowsiness"
  image_size: 224
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  splits:
    train: "Train"
    val: "Val"
    test: "Test"
  class_to_idx:
    Closed_Eyes: 0
    No_yawn: 1
    Open_Eyes: 2
    Yawn: 3

model:
  name: "mobilenet_v3_large"
  pretrained: true
  num_classes: 4
  # Fraction of backbone features layers unfrozen in stage 2 (from the end)
  unfreeze_from_block: 12

training:
  epochs_stage1: 5
  epochs_stage2: 20
  learning_rate_stage1: 0.001
  learning_rate_stage2: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 5
  use_class_weights: false
  mixed_precision: true
  scheduler:
    type: "cosine"
    min_lr: 0.000001
  checkpoint_dir: "models"
  best_model_name: "best_model.pth"
  last_model_name: "last_model.pth"

runtime:
  device: "auto"  # auto | cuda | cpu

paths:
  results: "results"
  plots: "results/plots"
  confusion_matrix: "results/confusion_matrix"
  metrics: "results/metrics"
  predictions: "results/predictions"
  runs: "runs"
  logs: "logs"

drowsiness:
  closed_eye_warning_seconds: 1.5
  closed_eye_critical_seconds: 3.0
  yawn_warning_count: 2
  yawn_window_seconds: 60
  prediction_history_size: 15
  smoothing_window: 5
  yawn_min_duration_seconds: 0.8
  blink_max_seconds: 0.5

fatigue_score:
  eye_closure_weight: 60
  yawning_weight: 30
  repeated_closure_weight: 10
  levels:
    normal_max: 29
    warning_max: 59
    drowsy_max: 79
    # 80–100 = CRITICAL

alerts:
  enabled: true
  cooldown_seconds: 5
  audio_enabled: true

webcam:
  camera_index: 0
  mirror: true
  face_padding: 0.25
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

augmentation:
  random_resized_crop_scale: [0.85, 1.0]
  horizontal_flip_prob: 0.5
  rotation_degrees: 10
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.15
    hue: 0.02
  affine:
    degrees: 5
    translate: [0.05, 0.05]
    scale: [0.95, 1.05]
